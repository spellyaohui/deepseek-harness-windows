# Desktop overlay for AgentTeams: members default to V4 Flash + MAX.
# The captain keeps the session picker (typically V4 Pro + MAX).
# memberReasoningEffort is accepted after the --import rewrite adds it to
# the plugin Config schema; without that rewrite the field would be dropped.
- insert:
    - id: desktop-settings
      name: '@deepseek-ai/dsh-desktop-settings'
    - id: agent-teams
      name: '@nanmicoder/dsh-agent-teams'
      config:
        stateDir: .agent-teams
        memberProvider: spawn
        memberModel: deepseek-v4-flash
        memberReasoningEffort: max
