# Desktop overlay: AgentTeams owns member model and reasoning configuration.
- insert:
    - id: desktop-settings
      name: '@deepseek-ai/dsh-desktop-settings'
    - id: cpa-provider
      name: '@deepseek-ai/dsh-cpa-provider'
    - id: opencode-capabilities
      name: '@deepseek-ai/dsh-opencode-capabilities'
    - id: tool-call-guidance
      name: '@deepseek-ai/dsh-tool-call-guidance'
    - id: session-markdown-export
      name: '@deepseek-ai/dsh-session-markdown-export'
    - id: agent-teams
      name: '@nanmicoder/dsh-agent-teams'
      config:
        stateDir: .agent-teams
        memberProvider: spawn
        profiles:
          software-delivery:
            description: "A general software delivery team for analysis, implementation, verification, and review."
            protocol: "Keep scope, acceptance criteria, and verification evidence traceable. Analyze before implementation and verify before delivery."
            taskPlanning: captain
            members:
              - name: analyst
                role: "Requirements analyst"
                reasoning_mode: target-default
              - name: implementer
                role: "Implementation engineer"
                reasoning_mode: target-default
              - name: tester
                role: "Verification engineer"
                reasoning_mode: target-default
              - name: reviewer
                role: "Code and risk reviewer"
                reasoning_mode: target-default
